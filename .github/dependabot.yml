version: 2
updates:
  # pyproject.toml + uv.lock (repository root)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
